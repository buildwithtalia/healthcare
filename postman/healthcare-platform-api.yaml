      operationId: deleteAiAgent
      responses:
        '204':
          description: AI agent deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ai-agents/{agentId}/invoke:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [AI Agents]
      summary: Invoke AI Agent
      description: Invokes an AI agent with the provided input payload and returns the agent's response.
      operationId: invokeAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: object
                  description: Input data for the AI agent
                  additionalProperties: true
                context:
                  type: object
                  description: Optional contextual data for the invocation
                  additionalProperties: true
                sessionId:
                  type: string
                  description: Optional session identifier for stateful agents
      responses:
        '200':
          description: AI agent invocation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentId:
                    type: string
                  output:
                    type: object
                    additionalProperties: true
                  sessionId:
                    type: string
                  executionTime:
                    type: number
                    description: Execution time in milliseconds
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ai-agents/{agentId}/deploy:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [AI Agents]
      summary: Deploy AI Agent
      description: Deploys an AI agent to the production environment, making it available for invocation.
      operationId: deployAiAgent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                environment:
                  type: string
                  enum: [staging, production]
                  default: production
                  description: Target deployment environment
                version:
                  type: string
                  description: Version tag for this deployment
      responses:
        '200':
          description: AI agent deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAgent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ai-agents/{agentId}/retire:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [AI Agents]
      summary: Retire AI Agent
      description: Retires an AI agent, removing it from active service while preserving its record.
      operationId: retireAiAgent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for retiring the agent
      responses:
        '200':
          description: AI agent retired successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAgent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ─── Components ───────────────────────────────────────────────────────────────

components:

  parameters:
    patientId:
      name: patientId
      in: path
      required: true
      description: Unique identifier of the patient
      schema:
        type: string
    providerId:
      name: providerId
      in: path
      required: true
      description: Unique identifier of the provider
      schema:
        type: string
    appointmentId:
      name: appointmentId
      in: path
      required: true
      description: Unique identifier of the appointment
      schema:
        type: string
    ehrId:
      name: ehrId
      in: path
      required: true
      description: Unique identifier of the EHR record
      schema:
        type: string
    labId:
      name: labId
      in: path
      required: true
      description: Unique identifier of the lab result
      schema:
        type: string
    imagingId:
      name: imagingId
      in: path
      required: true
      description: Unique identifier of the imaging study
      schema:
        type: string
    rxId:
      name: rxId
      in: path
      required: true
      description: Unique identifier of the prescription
      schema:
        type: string
    policyId:
      name: policyId
      in: path
      required: true
      description: Unique identifier of the insurance policy
      schema:
        type: string
    claimId:
      name: claimId
      in: path
      required: true
      description: Unique identifier of the claim
      schema:
        type: string
    invoiceId:
      name: invoiceId
      in: path
      required: true
      description: Unique identifier of the invoice
      schema:
        type: string
    paymentId:
      name: paymentId
      in: path
      required: true
      description: Unique identifier of the payment
      schema:
        type: string
    notificationId:
      name: notificationId
      in: path
      required: true
      description: Unique identifier of the notification
      schema:
        type: string
    deviceId:
      name: deviceId
      in: path
      required: true
      description: Unique identifier of the device
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      required: true
      description: Unique identifier of the AI agent
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request – invalid or missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Shared ──────────────────────────────────────────────────────────────────

    GenericResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type or code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
        uptime:
          type: number
        timestamp:
          type: string
          format: date-time

    # ── Patient ─────────────────────────────────────────────────────────────────

    Patient:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other, unknown]
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PatientInput:
      type: object
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other, unknown]
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    PatientPatch:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    PatientList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── Provider ────────────────────────────────────────────────────────────────

    Provider:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        specialty:
          type: string
        npi:
          type: string
          description: National Provider Identifier
        email:
          type: string
          format: email
        phone:
          type: string
        department:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProviderInput:
      type: object
      required: [firstName, lastName, specialty]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        specialty:
          type: string
        npi:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        department:
          type: string

    ProviderPatch:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        specialty:
          type: string
        npi:
          type: string
        email:
          type: string
        phone:
          type: string
        department:
          type: string

    ProviderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── Appointment ─────────────────────────────────────────────────────────────

    Appointment:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        providerId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
        type:
          type: string
          enum: [in_person, telehealth, phone]
        status:
          type: string
          enum: [scheduled, confirmed, checked_in, completed, cancelled, no_show]
        reason:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppointmentInput:
      type: object
      required: [patientId, providerId, scheduledAt]
      properties:
        patientId:
          type: string
        providerId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        duration:
          type: integer
          default: 30
        type:
          type: string
          enum: [in_person, telehealth, phone]
          default: in_person
        reason:
          type: string
        notes:
          type: string

    AppointmentPatch:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        duration:
          type: integer
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        notes:
          type: string

    AppointmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── EHR ─────────────────────────────────────────────────────────────────────

    Ehr:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        providerId:
          type: string
        visitDate:
          type: string
          format: date-time
        chiefComplaint:
          type: string
        diagnosis:
          type: array
          items:
            type: string
        medications:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        vitals:
          $ref: '#/components/schemas/Vitals'
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EhrInput:
      type: object
      required: [patientId, visitDate]
      properties:
        patientId:
          type: string
        providerId:
          type: string
        visitDate:
          type: string
          format: date-time
        chiefComplaint:
          type: string
        diagnosis:
          type: array
          items:
            type: string
        medications:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        vitals:
          $ref: '#/components/schemas/Vitals'
        notes:
          type: string

    EhrPatch:
      type: object
      properties:
        chiefComplaint:
          type: string
        diagnosis:
          type: array
          items:
            type: string
        medications:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        vitals:
          $ref: '#/components/schemas/Vitals'
        notes:
          type: string

    EhrList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ehr'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── Lab ─────────────────────────────────────────────────────────────────────

    Lab:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        providerId:
          type: string
        testName:
          type: string
        testCode:
          type: string
        result:
          type: string
        unit:
          type: string
        referenceRange:
          type: string
        status:
          type: string
          enum: [pending, resulted, abnormal, critical]
        collectedAt:
          type: string
          format: date-time
        resultedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LabInput:
      type: object
      required: [patientId, testName]
      properties:
        patientId:
          type: string
        providerId:
          type: string
        testName:
          type: string
        testCode:
          type: string
        result:
          type: string
        unit:
          type: string
        referenceRange:
          type: string
        status:
          type: string
          enum: [pending, resulted, abnormal, critical]
        collectedAt:
          type: string
          format: date-time

    LabPatch:
      type: object
      properties:
        result:
          type: string
        unit:
          type: string
        referenceRange:
          type: string
        status:
          type: string
        resultedAt:
          type: string
          format: date-time

    LabList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lab'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── Imaging ─────────────────────────────────────────────────────────────────

    Imaging:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        providerId:
          type: string
        modality:
          type: string
          enum: [X-Ray, CT, MRI, Ultrasound, PET, Mammography, Fluoroscopy]
        bodyPart:
          type: string
        indication:
          type: string
        findings:
          type: string
        impression:
          type: string
