    put:
      tags: [AI Agents]
      summary: Update AI Agent
      description: Replaces an existing AI agent record with the provided data.
      operationId: updateAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAgentInput'
      responses:
        '200':
          description: AI agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAgent'
