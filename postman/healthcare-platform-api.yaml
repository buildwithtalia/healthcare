openapi: 3.0.3
info:
  title: Healthcare Platform API
  version: 1.0.0
  description: A comprehensive healthcare platform API covering patients, providers, appointments, EHR, lab results, imaging, pharmacy, insurance, claims, invoices, payments, notifications, devices, and AI agents.

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: "http://localhost:5000"

tags:
  - name: Platform
    description: Core platform endpoints including health checks and service catalog
  - name: Patients
    description: Patient management and records
  - name: Providers
    description: Healthcare provider management and scheduling
  - name: Appointments
    description: Appointment scheduling and management
  - name: EHR
    description: Electronic Health Records management
  - name: Lab
    description: Laboratory results and orders
  - name: Imaging
    description: Medical imaging studies
  - name: Pharmacy
    description: Prescription and pharmacy management
  - name: Insurance
    description: Insurance policy management and eligibility
  - name: Claims
    description: Insurance claims processing and adjudication
  - name: Invoices
    description: Invoice management and billing
  - name: Payments
    description: Payment processing and records
  - name: Notifications
    description: Notification management and delivery
  - name: Devices
    description: Medical device registration and readings
  - name: AI Agents
    description: AI agent registration, deployment, and invocation

paths:

  # ─── Platform ───────────────────────────────────────────────────────────────

  /api:
    get:
      tags: [Platform]
      summary: Get API Root
      description: Returns the root API information and available resource links.
      operationId: getApiRoot
      responses:
        '200':
          description: API root information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/catalog:
    get:
      tags: [Platform]
      summary: Get Service Catalog
      description: Returns the full catalog of available services and their endpoints.
      operationId: getServiceCatalog
      responses:
        '200':
          description: Service catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/health:
    get:
      tags: [Platform]
      summary: Health Check
      description: Returns the current health status of the API and its dependencies.
      operationId: healthCheck
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Patients ────────────────────────────────────────────────────────────────

  /api/patients/:
    get:
      tags: [Patients]
      summary: List Patients
      description: Retrieves a paginated list of all patients in the system.
      operationId: listPatients
      responses:
        '200':
          description: A list of patients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientList'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Patients]
      summary: Create Patient
      description: Creates a new patient record in the system.
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/patients/search:
    get:
      tags: [Patients]
      summary: Search Patients
      description: Searches for patients by name, identifier, or other attributes.
      operationId: searchPatients
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
            example: ava
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/patients/{patientId}:
    parameters:
      - $ref: '#/components/parameters/patientId'
    get:
      tags: [Patients]
      summary: Get Patient
      description: Retrieves a single patient record by their unique identifier.
      operationId: getPatient
      responses:
        '200':
          description: Patient record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Patients]
      summary: Update Patient
      description: Replaces an existing patient record with the provided data.
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Patients]
      summary: Patch Patient
      description: Partially updates an existing patient record.
      operationId: patchPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientPatch'
      responses:
        '200':
          description: Patient patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Patients]
      summary: Delete Patient
      description: Deletes a patient record from the system.
      operationId: deletePatient
      responses:
        '204':
          description: Patient deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/patients/{patientId}/summary:
    parameters:
      - $ref: '#/components/parameters/patientId'
    get:
      tags: [Patients]
      summary: Get Patient Summary
      description: Retrieves a comprehensive summary of a patient including recent records, appointments, and vitals.
      operationId: getPatientSummary
      responses:
        '200':
          description: Patient summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Providers ───────────────────────────────────────────────────────────────

  /api/providers/:
    get:
      tags: [Providers]
      summary: List Providers
      description: Retrieves a paginated list of all healthcare providers.
      operationId: listProviders
      responses:
        '200':
          description: A list of providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Providers]
      summary: Create Provider
      description: Registers a new healthcare provider in the system.
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      responses:
        '201':
          description: Provider created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/providerId'
    get:
      tags: [Providers]
      summary: Get Provider
      description: Retrieves a single provider record by their unique identifier.
      operationId: getProvider
      responses:
        '200':
          description: Provider record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Providers]
      summary: Update Provider
      description: Replaces an existing provider record with the provided data.
      operationId: updateProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      responses:
        '200':
          description: Provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Providers]
      summary: Patch Provider
      description: Partially updates an existing provider record.
      operationId: patchProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPatch'
      responses:
        '200':
          description: Provider patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Providers]
      summary: Delete Provider
      description: Removes a provider record from the system.
      operationId: deleteProvider
      responses:
        '204':
          description: Provider deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/providers/{providerId}/schedule:
    parameters:
      - $ref: '#/components/parameters/providerId'
    get:
      tags: [Providers]
      summary: Get Provider Schedule
      description: Retrieves the availability schedule for a specific provider.
      operationId: getProviderSchedule
      responses:
        '200':
          description: Provider schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Appointments ─────────────────────────────────────────────────────────────

  /api/appointments/:
    get:
      tags: [Appointments]
      summary: List Appointments
      description: Retrieves a paginated list of all appointments.
      operationId: listAppointments
      responses:
        '200':
          description: A list of appointments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentList'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Appointments]
      summary: Create Appointment
      description: Schedules a new appointment between a patient and provider.
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        '201':
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/appointments/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    get:
      tags: [Appointments]
      summary: Get Appointment
      description: Retrieves a single appointment by its unique identifier.
      operationId: getAppointment
      responses:
        '200':
          description: Appointment record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Appointments]
      summary: Update Appointment
      description: Replaces an existing appointment record with the provided data.
      operationId: updateAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        '200':
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Appointments]
      summary: Patch Appointment
      description: Partially updates an existing appointment record.
      operationId: patchAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentPatch'
      responses:
        '200':
          description: Appointment patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Appointments]
      summary: Delete Appointment
      description: Deletes an appointment record from the system.
      operationId: deleteAppointment
      responses:
        '204':
          description: Appointment deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/appointments/{appointmentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    post:
      tags: [Appointments]
      summary: Cancel Appointment
      description: Cancels a scheduled appointment and notifies relevant parties.
      operationId: cancelAppointment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for cancellation
      responses:
        '200':
          description: Appointment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/appointments/{appointmentId}/check-in:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    post:
      tags: [Appointments]
      summary: Check In Appointment
      description: Records the patient check-in for a scheduled appointment.
      operationId: checkInAppointment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checkedInAt:
                  type: string
                  format: date-time
                  description: Timestamp of check-in
      responses:
        '200':
          description: Patient checked in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── EHR ─────────────────────────────────────────────────────────────────────

  /api/ehr/:
    get:
      tags: [EHR]
      summary: List EHR Records
      description: Retrieves a paginated list of all electronic health records.
      operationId: listEhrRecords
      responses:
        '200':
          description: A list of EHR records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EhrList'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [EHR]
      summary: Create EHR Record
      description: Creates a new electronic health record for a patient.
      operationId: createEhrRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhrInput'
      responses:
        '201':
          description: EHR record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ehr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ehr/{ehrId}:
    parameters:
      - $ref: '#/components/parameters/ehrId'
    get:
      tags: [EHR]
      summary: Get EHR Record
      description: Retrieves a single electronic health record by its unique identifier.
      operationId: getEhrRecord
      responses:
        '200':
          description: EHR record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ehr'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [EHR]
      summary: Update EHR Record
      description: Replaces an existing EHR record with the provided data.
      operationId: updateEhrRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhrInput'
      responses:
        '200':
          description: EHR record updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ehr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [EHR]
      summary: Patch EHR Record
      description: Partially updates an existing EHR record.
      operationId: patchEhrRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhrPatch'
      responses:
        '200':
          description: EHR record patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ehr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [EHR]
      summary: Delete EHR Record
      description: Deletes an electronic health record from the system.
      operationId: deleteEhrRecord
      responses:
        '204':
          description: EHR record deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ehr/patient/{patientId}:
    parameters:
      - $ref: '#/components/parameters/patientId'
    get:
      tags: [EHR]
      summary: Get EHR Records by Patient
      description: Retrieves all electronic health records associated with a specific patient.
      operationId: getEhrRecordsByPatient
      responses:
        '200':
          description: EHR records for the patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EhrList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Lab ─────────────────────────────────────────────────────────────────────

  /api/lab/:
    get:
      tags: [Lab]
      summary: List Lab Results
      description: Retrieves a paginated list of all laboratory results.
      operationId: listLabResults
      responses:
        '200':
          description: A list of lab results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabList'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Lab]
      summary: Create Lab Result
      description: Creates a new laboratory result record.
      operationId: createLabResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabInput'
      responses:
        '201':
          description: Lab result created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/lab/abnormal:
    get:
      tags: [Lab]
      summary: Get Abnormal Lab Results
      description: Retrieves all laboratory results flagged as abnormal or out of range.
      operationId: getAbnormalLabResults
      responses:
        '200':
          description: Abnormal lab results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabList'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/lab/{labId}:
    parameters:
      - $ref: '#/components/parameters/labId'
    get:
      tags: [Lab]
      summary: Get Lab Result
      description: Retrieves a single laboratory result by its unique identifier.
      operationId: getLabResult
      responses:
        '200':
          description: Lab result record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Lab]
      summary: Update Lab Result
      description: Replaces an existing lab result record with the provided data.
      operationId: updateLabResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabInput'
      responses:
        '200':
          description: Lab result updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Lab]
      summary: Patch Lab Result
      description: Partially updates an existing lab result record.
      operationId: patchLabResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabPatch'
      responses:
        '200':
          description: Lab result patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Lab]
      summary: Delete Lab Result
      description: Deletes a laboratory result record from the system.
      operationId: deleteLabResult
      responses:
        '204':
          description: Lab result deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/lab/patient/{patientId}:
    parameters:
      - $ref: '#/components/parameters/patientId'
    get:
      tags: [Lab]
      summary: Get Lab Results by Patient
      description: Retrieves all laboratory results associated with a specific patient.
      operationId: getLabResultsByPatient
      responses:
        '200':
          description: Lab results for the patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Imaging ─────────────────────────────────────────────────────────────────

  /api/imaging/:
    get:
      tags: [Imaging]
      summary: List Imaging Studies
      description: Retrieves a paginated list of all medical imaging studies.
      operationId: listImagingStudies
      responses:
        '200':
          description: A list of imaging studies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingList'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Imaging]
      summary: Create Imaging Study
      description: Creates a new medical imaging study record.
      operationId: createImagingStudy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagingInput'
      responses:
        '201':
          description: Imaging study created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imaging'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/imaging/{imagingId}:
    parameters:
      - $ref: '#/components/parameters/imagingId'
    get:
      tags: [Imaging]
      summary: Get Imaging Study
      description: Retrieves a single imaging study by its unique identifier.
      operationId: getImagingStudy
      responses:
        '200':
          description: Imaging study record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imaging'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Imaging]
      summary: Update Imaging Study
      description: Replaces an existing imaging study record with the provided data.
      operationId: updateImagingStudy
      requestBody:
