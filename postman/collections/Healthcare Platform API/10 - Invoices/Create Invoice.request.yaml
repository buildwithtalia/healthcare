$kind: http-request
name: Create Invoice
method: POST
url: '{{baseUrl}}/api/invoices/'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1000,
      "claim_id": 1000,
      "total": 75.0,
      "line_items": [
        {"desc": "Office visit copay", "amount": 35.0},
        {"desc": "Lab fee", "amount": 40.0}
      ],
      "due_date": "2026-08-10"
    }
